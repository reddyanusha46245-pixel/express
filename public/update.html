<!-- UPDATE STUDENT DETAILS-->
<!DOCTYPE html>
<html>

<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
    <title>Update Student</title>
</head>

<body>
    <h1>UPDATE STUDENT</h1>
    <hr>
    <a href="index.html">Home</a> |
    <a href="list.html">List Students</a> |
    <a href="listOne.html">List Required Student</a> |
    <a href="insert.html">Insert Student</a> |
    <a href="update.html">Update Student</a> |
    <a href="delete.html">Delete Student</a>
    <hr>
    Student Number
    <input type="number" id="sno">
    <br><br>
    Student Name
    <input type="text" id="name">
    <br><br>
    Total Marks
    <input type="number" id="total">
    <br><br>
    age
    <input type="number" id="age">
    <br><br>
    phone no
    <input type="text" id="phone number">
    <br><br>
    <button onclick="updateStudent()">Update</button>

    <br><br>
    <button onclick="location.href='index.html'">Home Page</button>

    <script>
        function updateStudent() {

            let sno = document.getElementById("sno").value;
            let name = document.getElementById("name").value;
            let total = document.getElementById("total").value;
            let age = document.getElementById("age").value;
            let phone no = document.getElementById("phone no").value;

            fetch("/students/" + sno, {
                method: "PUT",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    name: name,
                    total: total,
                    age: age,
                    phone no: phone no
                })
            })
                .then(response => {
                    if (response.ok)
                        return response.text();

                    return response.text().then(message => {
                        throw new Error(message);
                    });

                })  //end of .then

                .then(message => {
                    alert(message);
                    location.href = "index.html";
                })

                .catch(error => {

                    alert(error.message);
                });

        }//End of function
    </script>
</body>

</html>
